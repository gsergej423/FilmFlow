<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FilmFlow — Магия Гарри Поттера</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        body[data-page="magic"] {
            background: radial-gradient(circle at 20% 20%, #1a1e2b, #0b0f14);
        }
        .magic-header {
            font-family: 'Cinzel', serif;
            text-align: center;
            margin: 20px 0;
        }
        .magic-header h1 {
            font-size: 42px;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #d4af37, 0 0 30px #aa7e2b;
            color: #f5e7b2;
            margin-bottom: 8px;
        }
        .magic-header p {
            font-style: italic;
            color: #c0b7a9;
        }
        .magic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .magic-card {
            background: rgba(20, 15, 30, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid #6e5a3a;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 0 1px #d4af37 inset;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .magic-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.2), 0 0 0 2px #d4af37 inset;
        }
        .magic-poster {
            height: 280px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .magic-poster::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, rgba(11,15,20,0.9) 0%, transparent 50%);
        }
        .magic-title {
            padding: 14px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 18px;
            color: #f3e3b0;
            text-shadow: 0 2px 5px black;
        }
        .magic-year {
            padding: 0 14px 14px;
            color: #b89f6e;
            font-size: 14px;
        }
        .magic-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #740001;
            color: #d4af37;
            padding: 6px 12px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #d4af37;
            z-index: 2;
        }
    </style>
</head>
<body data-page="magic">
    <header>
        <div class="container">
            <div class="topbar">
                <a class="logo" href="index.html"><span class="logo-badge">F</span> FilmFlow</a>
                <nav>
                    <a class="navlink" data-nav="home" href="index.html">Главная</a>
                    <a class="navlink" data-nav="catalog" href="catalog.html">Каталог</a>
                    <a class="navlink" data-nav="magic" href="magic.html">Магия</a>
                    <a class="navlink" data-nav="watch" href="watch.html">Смотреть</a>
                    <a class="navlink" data-nav="tv" href="tv.html">ТВ</a>
                    <a class="navlink" data-nav="profile" href="profile.html">Профиль</a>
                    <a class="navlink" data-nav="collection" href="collection.html">Коллекция</a>
                    <a class="navlink external" href="https://rutube.ru/" target="_blank" rel="noopener noreferrer">🎬 Rutube</a>
                    <a class="navlink external" href="https://vkvideo.ru/" target="_blank" rel="noopener noreferrer">📺 VK Видео</a>
                </nav>
                <div class="spacer"></div>
                <div class="row" style="gap:10px">
                    <div class="avatar" id="navAvatar">Г</div>
                    <div class="small"><span id="navName">Гость</span></div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="magic-header">
            <h1>⚡ Магия Гарри Поттера ⚡</h1>
            <p>Все фильмы в хронологическом порядке + специальный выпуск</p>
        </div>

        <div id="magicGrid" class="magic-grid"></div>

        <footer>
            <div class="small" style="text-align:center; margin-top:40px;">
                FilmFlow — раздел для истинных волшебников. «Я торжественно клянусь, что замышляю только шалость!»
            </div>
        </footer>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
