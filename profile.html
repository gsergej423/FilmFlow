<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FilmFlow — профиль</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="profile">
    <header>
        <div class="container">
            <div class="topbar">
                <a class="logo" href="index.html"><span class="logo-badge">F</span> FilmFlow</a>
                <nav>
                    <a class="navlink" data-nav="home" href="index.html">Главная</a>
                    <a class="navlink" data-nav="catalog" href="catalog.html">Каталог</a>
                    <a class="navlink" data-nav="magic" href="magic.html">Магия</a>
                    <a class="navlink" data-nav="watch" href="watch.html">Смотреть</a>
                    <a class="navlink" data-nav="tv" href="tv.html">ТВ</a>
                    <a class="navlink active" data-nav="profile" href="profile.html">Профиль</a>
                    <a class="navlink" data-nav="collection" href="collection.html">Коллекция</a>
                    <a class="navlink external" href="https://rutube.ru/" target="_blank" rel="noopener noreferrer">🎬 Rutube</a>
                    <a class="navlink external" href="https://vkvideo.ru/" target="_blank" rel="noopener noreferrer">📺 VK Видео</a>
                </nav> 
                <div class="spacer"></div>
                <div class="row" style="gap:10px">
                    <div class="avatar" id="navAvatar">Г</div>
                    <div class="small"><span id="navName">Гость</span></div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="panel">
            <div class="panel-head">
                <div class="avatar" id="pAvatar">Г</div>
                <div>
                    <strong id="pName">Гость</strong>
                    <div class="small">Настройки профиля и твои списки</div>
                </div>
                <span class="spacer"></span>
                <a class="pill" href="catalog.html">Каталог</a>
                <a class="pill accent" href="watch.html">Смотреть</a>
            </div>
            <div class="panel-body">
                <div class="grid">
                    <div class="panel" style="grid-column: span 6;">
                        <div class="panel-head"><strong>Профиль</strong></div>
                        <div class="panel-body">
                            <form id="profileForm">
                                <div class="field" style="max-width:420px">
                                    <label for="inpName">Имя</label>
                                    <input id="inpName" type="text" name="username" placeholder="Например: Артём" required />
                                </div>
                                <div class="row" style="margin-top:12px">
                                    <button class="pill accent" type="submit">Сохранить</button>
                                    <button class="pill danger" type="button" id="btnResetAll">Сбросить данные</button>
                                </div>
                                <div id="error" class="small" style="color: #ff6b6b; margin-top: 8px;"></div>
                            </form>
                        </div>
                    </div>
                    <div class="panel" style="grid-column: span 6;">
                        <div class="panel-head"><strong>Статистика</strong></div>
                        <div class="panel-body">
                            <div class="kv">
                                <div class="k">Избранное</div>
                                <div class="v"><strong id="favCount">0</strong></div>
                                <div class="k">Смотреть позже</div>
                                <div class="v"><strong id="wlCount">0</strong></div>
                            </div>
                            <hr />
                            <div><strong>Продолжить просмотр</strong></div>
                            <div class="list" id="continueList" style="margin-top:10px"></div>
                        </div>
                    </div>
                    <div class="panel" style="grid-column: span 6;">
                        <div class="panel-head"><strong>Избранное</strong></div>
                        <div class="panel-body">
                            <div class="list" id="favList"></div>
                        </div>
                    </div>
                    <div class="panel" style="grid-column: span 6;">
                        <div class="panel-head"><strong>Смотреть позже</strong></div>
                        <div class="panel-body">
                            <div class="list" id="wlList"></div>
                        </div>
                    </div>
                    <!-- Блок управления профилем будет добавлен скриптом -->
                </div>
            </div>
        </section>
        <footer>
            <div class="small">Профиль FilmFlow: имя, списки и продолжение просмотра.</div>
        </footer>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
