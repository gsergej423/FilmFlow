<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FilmFlow — Коллекция (плейлисты)</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="collection">
    <header>
        <div class="container">
            <div class="topbar">
                <a class="logo" href="index.html"><span class="logo-badge">F</span> FilmFlow</a>
                <nav>
                    <a class="navlink" data-nav="home" href="index.html">Главная</a>
                    <a class="navlink" data-nav="catalog" href="catalog.html">Каталог</a>
                    <a class="navlink" data-nav="magic" href="magic.html">Магия</a>
                    <a class="navlink" data-nav="watch" href="watch.html">Смотреть</a>
                    <a class="navlink" data-nav="tv" href="tv.html">ТВ</a>
                    <a class="navlink" data-nav="profile" href="profile.html">Профиль</a>
                    <a class="navlink active" data-nav="collection" href="collection.html">Коллекция</a>
                    <a class="navlink external" href="https://rutube.ru/" target="_blank" rel="noopener noreferrer">🎬 Rutube</a>
                    <a class="navlink external" href="https://vkvideo.ru/" target="_blank" rel="noopener noreferrer">📺 VK Видео</a>
                </nav>
                <div class="spacer"></div>
                <div class="row" style="gap:10px">
                    <div class="avatar" id="navAvatar">Г</div>
                    <div class="small"><span id="navName">Гость</span></div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Заголовок -->
        <div class="collection-header">
            <h1>📂 Мои плейлисты</h1>
            <p class="muted">Создавайте собственные списки видео и добавляйте ссылки с любых сайтов</p>
        </div>

        <!-- Список плейлистов (виден по умолчанию) -->
        <div id="playlistListView">
            <div class="row" style="margin-bottom:16px;">
                <button class="pill accent" id="btnCreatePlaylist">➕ Создать плейлист</button>
            </div>
            <div id="playlistGrid" class="playlist-grid"></div>
        </div>

        <!-- Просмотр одного плейлиста (скрыт) -->
        <div id="playlistDetailView" style="display:none;">
            <div class="row" style="margin-bottom:16px;">
                <button class="pill" id="btnBackToList">← Назад к списку</button>
                <h2 id="playlistTitle" style="margin:0; margin-left:12px;">Название плейлиста</h2>
                <span class="spacer"></span>
                <button class="pill accent" id="btnAddVideo">➕ Добавить видео</button>
                <button class="pill danger" id="btnDeletePlaylist">🗑 Удалить плейлист</button>
            </div>
            <div id="videoGrid" class="video-grid"></div>
        </div>

        <footer>
            <div class="small">Ваши плейлисты сохраняются в браузере.</div>
        </footer>
    </main>

    <!-- Модальное окно для создания плейлиста / добавления видео -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-head">
                <strong id="modalTitle">Создать плейлист</strong>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <form id="modalForm">
                    <div class="field">
                        <label for="modalInput1" id="modalLabel1">Название плейлиста</label>
                        <input type="text" id="modalInput1" placeholder="Введите название" required />
                    </div>
                    <div class="field" id="modalField2" style="display:none;">
                        <label for="modalInput2">Ссылка на видео</label>
                        <input type="url" id="modalInput2" placeholder="https://rutube.ru/video/..." />
                    </div>
                    <div class="row" style="margin-top:12px;">
                        <button class="pill accent" type="submit" id="modalSubmit">Создать</button>
                        <button class="pill" type="button" id="modalCancel">Отмена</button>
                    </div>
                    <div id="modalError" class="small" style="color:#ff6b6b; margin-top:8px;"></div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
