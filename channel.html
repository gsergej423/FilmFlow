<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FilmFlow — Просмотр канала</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="channel">
    <header>
        <div class="container">
            <div class="topbar">
                <a class="logo" href="index.html"><span class="logo-badge">F</span> FilmFlow</a>
                <nav>
                    <a class="navlink" data-nav="home" href="index.html">Главная</a>
                    <a class="navlink" data-nav="catalog" href="catalog.html">Каталог</a>
                    <a class="navlink" data-nav="magic" href="magic.html">Магия</a>
                    <a class="navlink" data-nav="watch" href="watch.html">Смотреть</a>
                    <a class="navlink" data-nav="tv" href="tv.html">ТВ</a>
                    <a class="navlink" data-nav="profile" href="profile.html">Профиль</a>
                    <a class="navlink external" href="https://rutube.ru/" target="_blank" rel="noopener noreferrer">🎬 Rutube</a>
                    <a class="navlink external" href="https://vkvideo.ru/" target="_blank" rel="noopener noreferrer">📺 VK Видео</a>
                </nav>
                <div class="spacer"></div>
                <div class="row" style="gap:10px">
                    <div class="avatar" id="navAvatar">Г</div>
                    <div class="small"><span id="navName">Гость</span></div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="channelContainer" style="display: none;">
            <div class="tv-channel-header">
                <div id="channelLogo" class="channel-logo"></div>
                <div>
                    <h1 id="channelName"></h1>
                    <div id="channelCategory" class="small"></div>
                </div>
                <span class="spacer"></span>
                <a class="pill" href="tv.html">← К списку каналов</a>
            </div>

            <div class="channel-tabs">
                <button class="channel-tab active" data-tab="live">Прямой эфир</button>
                <button class="channel-tab" data-tab="today">Сегодня</button>
                <button class="channel-tab" data-tab="archive">Архив</button>
            </div>

            <div id="tabContent" class="program-list"></div>
        </div>

        <div id="notFound" style="display: none; text-align: center; padding: 60px 20px;">
            <h2>Канал не найден</h2>
            <p class="muted">Проверьте правильность ссылки</p>
            <a class="pill accent" href="tv.html">Вернуться к списку каналов</a>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
