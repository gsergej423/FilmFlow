<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FilmFlow — телеканал</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="channel">
    <header>
        <div class="container">
            <div class="topbar">
                <a class="logo" href="index.html"><span class="logo-badge">F</span> FilmFlow</a>
                <nav>
                    <a class="navlink" data-nav="home" href="index.html">Главная</a>
                    <a class="navlink" data-nav="catalog" href="catalog.html">Каталог</a>
                    <a class="navlink" data-nav="magic" href="magic.html">Магия</a>
                    <a class="navlink" data-nav="watch" href="watch.html">Смотреть</a>
                    <a class="navlink" data-nav="music" href="music.html">Музыка</a>
                    <a class="navlink" data-nav="tv" href="tv.html">ТВ</a>
                    <a class="navlink" data-nav="profile" href="profile.html">Профиль</a>
                    <a class="navlink" data-nav="collection" href="collection.html">Коллекция</a>
                    <a class="navlink external" href="https://rutube.ru/" target="_blank" rel="noopener noreferrer">🎬 Rutube</a>
                    <a class="navlink external" href="https://vkvideo.ru/" target="_blank" rel="noopener noreferrer">📺 VK Видео</a>
                </nav>
                <div class="spacer"></div>
                <div class="row" style="gap:10px">
                    <div class="avatar" id="navAvatar">Г</div>
                    <div class="small"><span id="navName">Гость</span></div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="notFound" class="panel" style="display:none;">
            <div class="panel-head"><strong>Канал не найден</strong></div>
            <div class="panel-body">
                <p class="muted">Такого телеканала нет в базе.</p>
                <a class="pill accent" href="tv.html">← К списку каналов</a>
            </div>
        </div>

        <div id="channelContainer" style="display:none;">
            <div class="tv-channel-header">
                <div class="channel-logo" id="channelLogo"></div>
                <div>
                    <h1 id="channelName">—</h1>
                    <div class="small">
                        Категория: <span id="channelCategory">—</span>
                    </div>
                </div>
                <span class="spacer"></span>
                <a class="pill" href="tv.html">← Все каналы</a>
            </div>

            <div class="channel-tabs">
                <button class="channel-tab active" data-tab="live">🔴 Прямой эфир</button>
                <button class="channel-tab" data-tab="today">📅 Программа на сегодня</button>
                <button class="channel-tab" data-tab="archive">🗄 Архив</button>
            </div>

            <div id="tabContent"></div>
        </div>

        <footer style="margin-top:40px;">
            <div class="small">FilmFlow — карточка телеканала.</div>
        </footer>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
